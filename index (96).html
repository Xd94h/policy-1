<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Gulabi Gazette</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pl:#2a0c19;--pk:#d6165f;--bg:#f6f1f3;--ln:#e6dce1;--mut:#7a6670}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 'DM Sans',system-ui,sans-serif;background:var(--bg);color:#1d1419}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;background:var(--pl)}
#login form{background:#fff;padding:34px;width:min(360px,92vw);border-radius:12px;display:grid;gap:12px}
#login h2{margin:0}#err{color:#c0152f;min-height:20px;margin:0}
label{display:grid;gap:4px;font-weight:500;font-size:13px}
input,textarea,select{font:inherit;padding:9px 11px;border:1px solid #d5c8ce;border-radius:8px;background:#fff;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pk);border-color:var(--pk)}
.btn{background:var(--pk);color:#fff;border:0;padding:9px 16px;border-radius:8px;font:700 14px 'DM Sans';cursor:pointer}.btn:hover{background:#b30f4e}
.btn.ghost{background:#fff;color:#1d1419;border:1px solid #d5c8ce}.btn.ghost:hover{background:var(--bg)}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--pl);color:#e9d6df;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side h1{font-size:18px;color:#fff;margin:0 10px 22px}.side h1 span{color:#ff6fa5}
.side nav{display:grid;gap:3px}.side nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500}
.side nav a:hover{background:rgba(255,255,255,.08)}.side nav a.on{background:var(--pk);color:#fff}.side i{font-style:normal;width:18px;text-align:center}
.side .foot{margin-top:auto;display:grid;gap:4px}.side .foot a,.side .foot button{color:#e9d6df;background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font:inherit;text-decoration:none}.side .foot a:hover,.side .foot button:hover{background:rgba(255,255,255,.08)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:#fff;border-bottom:1px solid var(--ln)}.top h2{margin:0;font-size:20px}
#main{padding:24px 28px;display:grid;gap:18px;align-content:start}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:18px}.card h3{margin:0 0 12px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.stats small{color:var(--mut)}.stats b{display:block;font-size:30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bar{display:grid;grid-template-columns:140px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:13px}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{background:#f4e6ec;height:12px;border-radius:6px;overflow:hidden}.bar u{display:block;height:100%;background:var(--pk)}.bar em{font-style:normal;text-align:right;font-weight:700}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px}.mut{color:var(--mut);margin:0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--ln);vertical-align:middle}th{font-size:12px;color:var(--mut);background:#fbf7f9}
td.r{text-align:right;white-space:nowrap}td a{color:var(--pk);cursor:pointer;font-weight:700;margin-left:10px}td a.del{color:#c0152f}
.sw{display:inline-block;position:relative;width:40px;height:22px}.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.sw s{position:absolute;inset:0;background:#cdbfc6;border-radius:11px;transition:.2s}.sw s::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+s{background:var(--pk)}.sw input:checked+s::after{left:21px}.sw input:focus-visible+s{outline:2px solid #1d1419}
.form{display:grid;gap:14px;max-width:640px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
dialog{border:0;border-radius:12px;padding:24px;width:min(620px,94vw);max-height:92vh}dialog::backdrop{background:rgba(42,12,25,.5)}dialog h3{margin:0 0 14px}dialog>div{display:grid;gap:12px}
.tag{padding:2px 10px;border-radius:12px;background:#fde1ec;color:var(--pk);font-weight:700;font-size:12px}.tag.off{background:#eee;color:#666}
#toast{position:fixed;bottom:22px;right:22px;background:var(--pl);color:#fff;padding:11px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1}
@media(max-width:820px){#app{grid-template-columns:1fr}.side{position:static;height:auto}.side nav{grid-auto-flow:column;overflow-x:auto}.side .foot{display:none}.two,.row{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr 30px}#main{padding:16px}table{display:block;overflow-x:auto}}
</style></head><body>
<div id="login"><form onsubmit="return login(event)"><h2>Gazette Admin</h2><p class="mut" style="margin:0">Sign in to manage the user website.</p>
<label>Username<input id="lu" autocomplete="username" autofocus></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label><p id="err"></p><button class="btn">Sign in</button></form></div>
<div id="app" hidden><aside class="side"><h1>Gulabi <span>Gazette</span></h1><nav id="nav"></nav>
<div class="foot"><a href="../" target="_blank">View user site ↗</a><button onclick="logout()">Sign out</button></div></aside>
<div><div class="top"><h2 id="title"></h2><a class="btn ghost" style="text-decoration:none" href="../" target="_blank">Live site ↗</a></div><div id="main"></div></div></div>
<dialog id="dg"></dialog><div id="toast"></div>
<script src="../assets/config.js"></script><script src="../assets/store.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const fmt=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),uid=()=>Math.random().toString(36).slice(2,9);
const NAV=[['dashboard','▦','Dashboard'],['news','✎','News'],['ads','◈','Advertisements'],['ticker','≫','Breaking ticker'],['broadcast','✉','Broadcast'],['settings','⚙','Settings']];
let D,S={},view='dashboard';const ok=()=>sessionStorage.gg==='1';
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2200)}
async function login(e){e.preventDefault();if(!D){$('#err').textContent='Still connecting, try again.';return false}
 const h=await H($('#lu').value.trim()+':'+$('#lp').value),good=D.settings.auth||await H('admin:admin');
 if(h===good){sessionStorage.gg='1';$('#login').hidden=true;view=location.hash.slice(1)||'dashboard';if(!V[view])view='dashboard';draw()}else $('#err').textContent='Wrong username or password.';return false}
function logout(){sessionStorage.gg='';location.reload()}
addEventListener('hashchange',()=>{view=location.hash.slice(1)||'dashboard';if(!V[view])view='dashboard';if(D&&ok())draw()});
function draw(){$('#login').hidden=true;$('#app').hidden=false;
 $('#nav').innerHTML=NAV.map(([k,i,t])=>`<a href="#${k}" class="${k==view?'on':''}"><i>${i}</i>${t}</a>`).join('');
 $('#title').textContent=NAV.find(n=>n[0]==view)[2];$('#main').innerHTML=V[view]()}
const bars=(r,mx)=>r.length?r.map(([l,v])=>`<div class="bar"><span>${esc(l)}</span><div><u style="width:${v/mx*100}%"></u></div><em>${v}</em></div>`).join(''):'<p class="mut">No data yet.</p>';
const sw=(k,id,f,on)=>`<label class="sw"><input type="checkbox" ${on?'checked':''} onchange="tog('${k}','${id}','${f}',this.checked)"><s></s></label>`;
function tog(k,id,f,v){DB.save(d=>{d[k].find(x=>x.id==id)[f]=v});toast(v?'Now showing on user site':'Hidden from user site')}
function del(k,id){if(confirm('Delete this permanently?'))DB.save(d=>{d[k]=d[k].filter(x=>x.id!=id)}).then(()=>toast('Deleted'))}
function openDlg(h){$('#dg').innerHTML='<div>'+h+'</div>';$('#dg').showModal()}
const V={
dashboard(){const n=D.news,top=[...n].sort((a,b)=>(S['n_'+b.id]||0)-(S['n_'+a.id]||0)).slice(0,6),cats={};n.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+1);
 return `<div class="stats">${[['Total articles',n.length],['Live on user site',n.filter(x=>x.pub).length],['Active ads',D.ads.filter(a=>a.on).length],['Site visits',S.views||0]].map(([a,b])=>`<div class="card"><small>${a}</small><b>${b}</b></div>`).join('')}</div>
 <div class="two"><div class="card"><h3>Most read articles</h3>${bars(top.map(x=>[x.title,S['n_'+x.id]||0]),Math.max(1,...top.map(x=>S['n_'+x.id]||0)))}</div>
 <div class="card"><h3>Articles by section</h3>${bars(Object.entries(cats),Math.max(1,...Object.values(cats)))}</div></div>
 ${n.length?'':'<div class="card"><h3>Start here</h3><p class="mut">Write your first story in <a href="#news">News</a>, then publish it to the user site.</p></div>'}`},
news(){return `<div class="bar2"><p class="mut">Use the switch to show or hide a story on the user site instantly.</p><button class="btn" onclick="editNews()">+ New article</button></div>
 <div class="card" style="padding:0"><table><tr><th>Headline<th>Section<th>On user site<th>Reads<th></tr>${D.news.map(x=>`<tr><td><b>${esc(x.title)}</b>${x.lead?' <span class="tag">Lead</span>':''}<br><small class="mut">${esc(x.by)} · ${fmt(x.ts)}</small><td>${esc(x.cat)}<td>${sw('news',x.id,'pub',x.pub)}<td>${S['n_'+x.id]||0}<td class="r"><a onclick="editNews('${x.id}')">Edit</a><a class="del" onclick="del('news','${x.id}')">Delete</a></tr>`).join('')||'<tr><td colspan="5" class="mut">No articles yet.</tr>'}</table></div>`},
ads(){return `<div class="bar2"><p class="mut">Ads appear on the user site as a top banner or in the sidebar.</p><button class="btn" onclick="editAd()">+ New ad</button></div>
 <div class="card" style="padding:0"><table><tr><th>Ad<th>Placement<th>Active<th></tr>${D.ads.map(x=>`<tr><td><b>${esc(x.title)}</b><br><small class="mut">${esc(x.text)}</small><td>${x.place=='top'?'Top banner':'Sidebar'}<td>${sw('ads',x.id,'on',x.on)}<td class="r"><a onclick="editAd('${x.id}')">Edit</a><a class="del" onclick="del('ads','${x.id}')">Delete</a></tr>`).join('')||'<tr><td colspan="4" class="mut">No ads yet.</tr>'}</table></div>`},
ticker(){return `<div class="card form"><h3>Breaking news ticker</h3><p class="mut" style="margin:0">One headline per line. Leave empty to hide the ticker.</p><textarea id="tk" rows="8">${esc(D.ticker.join('\n'))}</textarea><div class="act"><button class="btn" onclick="saveTicker()">Save ticker</button></div></div>`},
broadcast(){const b=D.broadcast;return `<div class="card form"><h3>Broadcast message</h3><p class="mut" style="margin:0">Status: ${b.on?'<span class="tag">Live on user site</span>':'<span class="tag off">Not showing</span>'}</p>
 <label>Message<textarea id="bt" rows="3">${esc(b.text)}</textarea></label><label>Style<select id="bk"><option value="info" ${b.kind!='alert'?'selected':''}>Notice (pink)</option><option value="alert" ${b.kind=='alert'?'selected':''}>Alert (dark)</option></select></label>
 <div class="act"><button class="btn ghost" onclick="sendBc(false)">Take down</button><button class="btn" onclick="sendBc(true)">Send to user site</button></div></div>`},
settings(){const s=D.settings;return `<div class="card form"><h3>Site settings</h3><label>Site name<input id="sn" value="${esc(s.name)}"></label><label>Tagline<input id="st" value="${esc(s.tag)}"></label>
 <h3 style="margin-top:8px">Admin login</h3><p class="mut" style="margin:0">Leave blank to keep the current login (default is admin / admin).</p><div class="row"><label>New username<input id="nu"></label><label>New password<input id="np" type="password"></label></div>
 <div class="act"><button class="btn" onclick="saveSet()">Save settings</button></div></div>`}};
function editNews(id){const x=D.news.find(n=>n.id==id)||{};
 openDlg(`<h3>${id?'Edit':'New'} article</h3><label>Headline<input id="f_title" value="${esc(x.title)}"></label>
 <div class="row"><label>Section<input id="f_cat" value="${esc(x.cat||'General')}" list="cl"><datalist id="cl">${[...new Set(D.news.map(n=>n.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label><label>Author<input id="f_by" value="${esc(x.by||'Staff Reporter')}"></label></div>
 <label>Summary (shown on cards)<textarea id="f_sum" rows="2">${esc(x.sum)}</textarea></label><label>Full story<textarea id="f_body" rows="8">${esc(x.body)}</textarea></label>
 <label>Image URL (optional, https://…)<input id="f_img" value="${esc(x.img)}"></label><label class="chk"><input type="checkbox" id="f_lead" ${x.lead?'checked':''}> Make this the lead story</label>
 <div class="act"><button class="btn ghost" onclick="dg.close()">Cancel</button><button class="btn ghost" onclick="saveNews('${id||''}',false)">Save as draft</button><button class="btn" onclick="saveNews('${id||''}',true)">Publish to user site</button></div>`)}
function saveNews(id,pub){const v=k=>$('#f_'+k).value.trim(),t=v('title');if(!t){toast('Add a headline first');return}
 const o={title:t,cat:v('cat')||'General',by:v('by'),sum:v('sum'),body:$('#f_body').value.trim(),img:v('img'),lead:$('#f_lead').checked,pub};
 DB.save(d=>{if(o.lead)d.news.forEach(n=>n.lead=false);if(id)Object.assign(d.news.find(n=>n.id==id),o);else d.news.unshift({id:uid(),ts:Date.now(),...o})}).then(()=>toast(pub?'Published to user site':'Saved as draft'));dg.close()}
function editAd(id){const x=D.ads.find(n=>n.id==id)||{};
 openDlg(`<h3>${id?'Edit':'New'} advertisement</h3><label>Title<input id="a_title" value="${esc(x.title)}"></label><label>Text<textarea id="a_text" rows="2">${esc(x.text)}</textarea></label>
 <label>Link (https://…)<input id="a_link" value="${esc(x.link)}"></label><label>Image URL (optional)<input id="a_img" value="${esc(x.img)}"></label>
 <label>Placement<select id="a_place"><option value="side" ${x.place!='top'?'selected':''}>Sidebar</option><option value="top" ${x.place=='top'?'selected':''}>Top banner</option></select></label>
 <div class="act"><button class="btn ghost" onclick="dg.close()">Cancel</button><button class="btn" onclick="saveAd('${id||''}')">Save & show on site</button></div>`)}
function saveAd(id){const v=k=>$('#a_'+k).value.trim();if(!v('title')){toast('Add a title first');return}
 const o={title:v('title'),text:v('text'),link:v('link'),img:v('img'),place:v('place')};
 DB.save(d=>{if(id)Object.assign(d.ads.find(n=>n.id==id),o);else d.ads.unshift({id:uid(),on:true,...o})}).then(()=>toast('Ad saved'));dg.close()}
function saveTicker(){const l=$('#tk').value.split('\n').map(s=>s.trim()).filter(Boolean);DB.save(d=>{d.ticker=l}).then(()=>toast('Ticker updated'))}
function sendBc(on){const t=$('#bt').value.trim(),k=$('#bk').value;if(on&&!t){toast('Write a message first');return}DB.save(d=>{d.broadcast={on,text:t,kind:k}}).then(()=>toast(on?'Broadcast sent':'Broadcast removed'))}
async function saveSet(){const u=$('#nu').value.trim(),p=$('#np').value,a=u&&p?await H(u+':'+p):null;
 if((u||p)&&!a){toast('Enter both a new username and password');return}
 DB.save(d=>{d.settings.name=$('#sn').value.trim()||d.settings.name;d.settings.tag=$('#st').value.trim();if(a)d.settings.auth=a}).then(()=>toast('Settings saved'))}
DB.on(d=>{D=d;if(ok())draw()});DB.onStats(s=>{S=s;if(ok()&&D)draw()});
if(ok())$('#login').hidden=true;
</script></body></html>
